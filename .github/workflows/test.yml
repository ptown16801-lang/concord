name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: node --version
      - run: npm run check
      - run: npm test
      - name: Validate governance fixtures when included
        shell: bash
        run: |
          if [ -d qa/jon58 ]; then
            node qa/jon58/validate-fixtures.mjs
          else
            echo 'Governance fixture pack absent from this branch; validation not run.'
          fi
