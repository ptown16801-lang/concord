name: test

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: node --version
      - run: npm run decisions:check
      - name: Require decision-impact disposition
        if: github.event_name == 'pull_request'
        run: node scripts/decisions.mjs disposition
      - run: npm run check
      - run: npm test
