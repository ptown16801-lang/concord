name: Pull request review context
# Read metadata only. Never check out PR code or copy its body, diff or check results.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_run:
    workflows: [test]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_number:
        description: Pull request number to refresh
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
# All events share the existing publication lock. Manual refresh remains available
# if GitHub coalesces a pending run. Keep the group stable during migration.
concurrency:
  group: concord-review-packet
  cancel-in-progress: false
jobs:
  review-packet:
    runs-on: ubuntu-latest
    steps:
      - name: Publish or block review context
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            // Retain the old marker so existing bot packets are replaced in place.
            const marker = '<!-- concord-grok-review-packet -->';
            const headers = [
              `${marker}\n# GROK REVIEW PACKET\n`,
              `${marker}\n# Pull request review context\n`
            ];
            const { owner, repo } = context.repo;
            const fullName = `${owner}/${repo}`;
            const summary = message => {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${message}\n`);
              core.notice(message);
            };
            const sha = value => /^[a-f0-9]{40}$/.test(value || '');
            const number = value =>
              (typeof value === 'number' || (typeof value === 'string' && /^[1-9][0-9]*$/.test(value))) &&
              Number.isSafeInteger(Number(value)) && Number(value) > 0;
            const identity = pr => JSON.stringify([
              pr.number, pr.head.sha, pr.base.sha, pr.merge_commit_sha, pr.title, pr.body,
              pr.state, pr.head.repo?.full_name, pr.base.repo?.full_name
            ]);
            const event = context.payload;
            let targets;
            if (context.eventName === 'pull_request') {
              targets = [{ number: event.pull_request.number, expected: event.pull_request.head.sha }];
            } else if (context.eventName === 'workflow_run') {
              const run = event.workflow_run;
              if (run.head_repository?.full_name !== fullName || !sha(run.head_sha)) {
                summary('BLOCKED: untrusted workflow repository or invalid revision.');
                return;
              }
              const prs = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
                owner, repo, commit_sha: run.head_sha, per_page: 100
              });
              targets = prs.map(pr => ({ number: pr.number, expected: run.head_sha }));
            } else if (context.eventName === 'workflow_dispatch' && number(event.inputs?.pull_number)) {
              targets = [{ number: Number(event.inputs.pull_number) }];
            } else {
              throw new Error('Unsupported event or invalid pull request number');
            }
            const visited = new Set();
            for (const target of targets) {
              if (!number(target.number)) throw new Error('Invalid pull request number');
              const pull_number = Number(target.number);
              if (visited.has(pull_number)) continue;
              visited.add(pull_number);
              const readPR = async () => (await github.rest.pulls.get({ owner, repo, pull_number })).data;
              const pr = await readPR();
              if (pr.number !== pull_number || pr.state !== 'open' ||
                  pr.head.repo?.full_name !== fullName || pr.base.repo?.full_name !== fullName) {
                summary(`BLOCKED: PR #${pull_number} is closed or not a same-repository PR.`);
                continue;
              }
              const head = pr.head.sha;
              const base = pr.base.sha;
              if (!sha(head) || !sha(base)) throw new Error('Invalid immutable revision');
              if (target.expected && target.expected !== head) {
                summary(`STALE: event for PR #${pull_number} no longer matches the head; no comment changed.`);
                continue;
              }
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pull_number, per_page: 100
              });
              const owned = comments.filter(comment =>
                comment.user?.login === 'github-actions[bot]' && comment.user?.type === 'Bot' &&
                String(comment.body || '').startsWith(`${marker}\n`));
              if (owned.length > 1) {
                summary(`BLOCKED: duplicate automation comments on PR #${pull_number}; no comment changed.`);
                continue;
              }
              // A queued event or concurrent edit must not relabel a different PR revision.
              if (identity(await readPR()) !== identity(pr)) {
                summary(`STALE: PR #${pull_number} changed during assembly; no comment changed.`);
                continue;
              }
              const url = `https://github.com/${fullName}/pull/${pull_number}`;
              const body = [
                headers[1],
                `PR #${pull_number} · Observed at ${new Date().toISOString()}`,
                `Head: \`${head}\``,
                `Base: \`${base}\``,
                '',
                `[Current description and discussion](${url}) · [Current changes](${url}/files) · [Current checks](${url}/checks)`,
                `[Comparison of the observed revisions](https://github.com/${fullName}/compare/${base}...${head})`,
                '',
                'This automated navigation comment contains no copied PR text, diff or check results.',
                'It is not a provider review, independent verification, owner acceptance, merge permission or deployment record.',
                'The linked PR and checks can change after the observation above. No PR code or provider was executed.'
              ].join('\n');
              if (owned.length === 1) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: owned[0].id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: pull_number, body });
              }
              summary(`Published review links for PR #${pull_number} at ${head}. No PR text, diff or check results copied.`);
            }
